name: Build Custom Image

on:
  push:
    branches:
      - codex/split-media-metadata-webhook
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-binary:
    uses: ./.github/workflows/build-binary.yaml

  build-image:
    needs: build-binary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bili-sync:dev
            ghcr.io/${{ github.repository_owner }}/bili-sync:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=custom-image
          cache-to: type=gha,scope=custom-image
