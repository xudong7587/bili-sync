services:
  bili-sync-rs:
    # 固定版本便于升级和回滚；新版本发布后再修改标签。
    image: ghcr.io/xudong7587/bili-sync:bili115-2026.09.27.1
    container_name: bili-sync-rs
    restart: unless-stopped

    # 原配置若修改了监听端口，请同步调整。
    ports:
      - "12345:12345"
    # 可选：按宿主机权限填写 UID:GID。
    # user: "1000:1000"
    environment:
      TZ: Asia/Shanghai
    volumes:
      # 升级时沿用原配置目录，继承账号、数据库、订阅与下载状态。
      - /path/to/bili-sync-config:/app/.config/bili-sync
      # 本地模式：视频和元数据；CD2 模式：仅元数据，视频经 CD2 上传。
      - /path/to/local-library:/media
      # 可选：原实例若单独映射 UP 主头像目录，请沿用原映射。
      # - /path/to/emby/metadata/people:/app/.config/bili-sync/upper_face

    # 在「视频网盘分流」选择本地或 CD2。
    # CD2 地址、API 令牌、网盘保存路径及 MediaIndex 通知都在网页设置中填写。
    # CD2 模式无需 /video 挂载。旧实例的其他挂载可保留，不会自动搬移已有视频。
    # 下载、合并和上传期间需要本地临时空间；至少容纳并发处理的视频。
