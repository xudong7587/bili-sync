services:
  bili-sync-rs:
    # 建议固定到已发布的版本；升级时修改此标签。
    image: ghcr.io/xudong7587/bili-sync:bili115-2026.09.23.2
    container_name: bili-sync-rs
    restart: unless-stopped

    # 管理页面默认使用 12345 端口。若原配置改过监听端口，请同步修改这里。
    ports:
      - "12345:12345"

    # 如需让写入的文件归指定用户所有，可取消注释并改成宿主机的 UID:GID。
    # user: "1000:1000"

    environment:
      TZ: Asia/Shanghai
      # 原有挂载写入模式：两个变量必须同时设置，订阅路径仍填写 /media/...。
      # 启用 CD2 直传后可继续保留这些映射，但新 MP4 不会写入 /video。
      BILI_SYNC_METADATA_ROOT: /media
      BILI_SYNC_VIDEO_ROOT: /video
      # MediaIndex 的 Webhook 地址和令牌在管理页的「设置 → 通知设置」中填写。

    volumes:
      # 将下面三个宿主机示例路径改成自己的实际路径。
      # 升级已有实例时，第一项应指向原实例的配置目录，以继承数据库和设置。
      - /path/to/bili-sync-config:/app/.config/bili-sync
      # 本地磁盘：NFO、海报、字幕等元数据；Emby 读取此目录。
      - /path/to/local-metadata:/media
      # 原有挂载写入模式的视频目录；CD2 直传模式不需要写入此目录。
      - /path/to/video-storage:/video
      # 可选：如果原实例单独映射了 UP 主头像目录，请沿用原映射及配置中的目标路径。
      # - /path/to/emby/metadata/people:/app/.config/bili-sync/upper_face
